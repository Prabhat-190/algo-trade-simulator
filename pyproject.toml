[project]
name = "algo-trade-simulator"
version = "1.0.0"
description = "Real-time transaction cost simulator for crypto and equity market orders"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [
    ".venv",
    "build",
    "dist",
    "trading/src/models/user_account.py",
    "trading/src/models/option_chain.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
]
ignore = [
    "E501",
    "B008",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
# Demo scripts intentionally print to stdout and build unused figure handles.
"trading/examples/*" = ["T201", "F841"]

[tool.pytest.ini_options]
testpaths = ["trading/tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
