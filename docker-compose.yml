# Local development stack.
#
#   docker compose up                      dashboard only (embedded synthetic feed)
#   docker compose --profile redis up       add Redis for shared project storage
#   docker compose --profile live up        add the live crypto WebSocket feeder
#   docker compose --profile stocks up      add the stock quote feeder (needs an API key)

services:
  dashboard:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      WEB_CONCURRENCY: 2
      GUNICORN_THREADS: 4
      LOG_LEVEL: INFO
      # "auto" consumes Redis when a feeder is publishing and falls back to the
      # embedded synthetic feed otherwise, so this works with or without profiles.
      FEED_SOURCE: auto
      REDIS_HOST: redis
      REDIS_PORT: 6379
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["redis", "live", "stocks"]
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  data_feeder:
    build: .
    profiles: ["live"]
    command: python -m trading.data_feeder
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WEBSOCKET_URI: ${WEBSOCKET_URI:-wss://ws.gomarket-cpp.goquant.io/ws/l2-orderbook/okx/BTC-USDT-SWAP}
      LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  stock_data_feeder:
    build: .
    profiles: ["stocks"]
    command: python -m trading.stock_data_feeder
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STOCK_SYMBOL: ${STOCK_SYMBOL:-AAPL}
      STOCK_PROVIDER: ${STOCK_PROVIDER:-finnhub}
      STOCK_POLL_INTERVAL: ${STOCK_POLL_INTERVAL:-15}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
