# Railway deployment config.
#
# This deploys as a SINGLE service with no add-ons required. The dashboard runs
# its own embedded market data feed (FEED_SOURCE=auto), so there is nothing else
# to provision to get a working URL.
#
# Optional upgrades, both described in the README:
#   * Add a Railway Redis database to share saved projects across replicas.
#   * Add a second service running `python -m trading.data_feeder` for live
#     exchange data; the dashboard prefers it automatically over the embedded feed.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "gunicorn --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2} --worker-class gthread --threads ${GUNICORN_THREADS:-4} --timeout 120 --graceful-timeout 30 --access-logfile - --error-logfile - trading.src.main:server"
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
